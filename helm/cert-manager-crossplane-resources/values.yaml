name: cert-manager-crossplane-resources
serviceType: managed
clusterName: ""

providers:
  # AWS configuration
  aws:
    enabled: false
    # If `accountID` or `oidc.domain` is empty, the missing values are read from the
    # `<clusterName>-crossplane-config` ConfigMap created by aws-resolver-rules-operator.
    accountID: ""
    partition: "aws"
    region: ""
    oidc:
      domain: ""
      additionalDomains: []
    # Route53 record name patterns cert-manager may change (IAM StringLike wildcards allowed),
    # e.g. "_acme-challenge.example.com".
    resourcePatterns: ["_acme-challenge.*"]

  # Azure configuration
  azure:
    enabled: false
    subscriptionId: ""
    resourceGroup: ""
    location: ""
    workloadIdentity:
      enabled: false
      oidcIssuerUrl: ""
