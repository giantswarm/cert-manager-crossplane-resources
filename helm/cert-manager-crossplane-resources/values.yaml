name: cert-manager-crossplane-resources
serviceType: managed
clusterName: ""

providers:
  # AWS configuration
  aws:
    enabled: false
    accountID: ""
    partition: "aws"
    region: ""
    oidc:
      domain: ""
      additionalDomains: []
    # Route53 record name patterns cert-manager may change (IAM StringLike wildcards allowed),
    # e.g. "_acme-challenge.example.com".
    resourcePatterns: ["_acme-challenge.*"]

  # Azure configuration
  azure:
    enabled: false
    subscriptionId: ""
    resourceGroup: ""
    location: ""
    workloadIdentity:
      enabled: false
      oidcIssuerUrl: ""
